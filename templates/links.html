{{define "content"}}
	<div class="inner">
		<h2>友链</h2>
		<p>这里收藏了一些常用的在线工具网站：</p>
		<ul class="link-list">
		{{range .Links}}
			<li>
				<a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Name}}</a>
				<span class="link-host">{{.URL | extractHost}}</span>
				<p class="link-desc">{{.Desc}}</p>
			</li>
		{{end}}
		</ul>
		<hr>
		<p><span>↶ </span><a href="/">返回首页</a></p>
	</div>
{{end}}
