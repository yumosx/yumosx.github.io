{{define "content"}}
	<div class="outer">
		<ul class="list-group">
		{{range .Posts}}
			<li class="list-group-item title">
				<div class="date">{{.Date}}</div>
				<a href="/posts/{{.Slug}}.html">{{.Title}}</a>
				<div class="word-count">{{.WordCount}} 字</div>
			</li>
		{{end}}
		</ul>
		<div class="footer">
			<p class="text-center">© {{now.Format "2006"}} {{.Site.Title}}</p>
		</div>
	</div>
{{end}}
