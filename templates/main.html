<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=0.5">
	<title>{{if .IsHome}}{{.Site.Title}}{{else}}{{.Title}} - {{.Site.Title}}{{end}}</title>
	{{if .IsHome}}
	<link rel="stylesheet" href="/static/css/bootstrap/bootstrap.min.css">
	<link rel="stylesheet" href="/static/css/bootstrap/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/css/home.css">
	{{else}}
	<link rel="stylesheet" href="/static/css/highlight/xcode.css">
	<link rel="stylesheet" href="/static/css/post.css">
	{{end}}
</head>
<body>
	<script>if (/mobile/i.test(navigator.userAgent) || /android/i.test(navigator.userAgent)) document.body.classList.add('mobile');</script>
	{{if .IsHome}}
	<nav class="navbar navbar-default" style="opacity: .9" role="navigation">
		<div class="container-fluid">
			<div class="navbar-header">
				<a class="navbar-brand" href="/">{{.Site.Title}}</a>
			</div>
			<div class="navbar-collapse" id="navbar-bs">
				<ul class="nav navbar-nav navbar-right">
					<li class="active"><a href="/">首页</a></li>
					<li><a href="/links.html">友链</a></li>
					<li><a href="/about.html">关于</a></li>
				</ul>
			</div>
		</div>
	</nav>
	{{end}}
	{{template "content" .}}
</body>
</html>
